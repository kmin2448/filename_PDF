name: Build Windows EXE

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install reportlab  # 파서 테스트용 샘플 PDF 생성

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE with PyInstaller
        run: pyinstaller --clean --noconfirm PDF_AutoRenamer.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Auto-Renamer-windows
          path: dist/PDF_Auto-Renamer.exe
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF_Auto-Renamer.exe
          generate_release_notes: true
